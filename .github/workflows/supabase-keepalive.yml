name: Supabase keep-alive

# Тримаємо безкоштовний проєкт живим справжнім записом у базу через RPC.
# Простий пінг на /rest/v1/ Supabase не рахує як активність, тож проєкт засинав.
# anon-ключ публічний за дизайном; функція keepalive() лише оновлює один timestamp.

on:
  schedule:
    - cron: '0 6 * * 1,3,5'   # Пн, Ср, Пт о 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Запис у базу, щоб проєкт не заснув
        env:
          SUPABASE_URL: https://qqxcxsxmoelcmyletirl.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_Ym6yiNiTjNT-pJ0Oq_axMQ_A1avpJs8
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json") || code="000"
          echo "Supabase RPC keepalive: HTTP $code"
          if [ "$code" = "000" ]; then
            echo "::error::Немає відповіді від Supabase — проєкт міг заснути. Зайди на supabase.com і натисни Resume."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Несподівана відповідь HTTP $code. Перевір, що функцію keepalive() створено в SQL Editor."
            exit 1
          fi
          echo "Готово: зроблено запис у базу, таймер неактивності скинуто."
